<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="512" height="512" viewBox="0 0 512 512">
  <desc>European flag icon</desc>
  <defs>
    <g id="s">
      <g id="c">
        <path id="t" d="M0,0v1h0.5z" transform="translate(0,-1)rotate(18)"/>
        <use xlink:href="#t" transform="scale(-1,1)"/>
      </g>
      <g id="a">
        <use xlink:href="#c" transform="rotate(72)"/>
        <use xlink:href="#c" transform="rotate(144)"/>
      </g>
      <use xlink:href="#a" transform="scale(-1,1)"/>
    </g>
  </defs>
  <!-- Square background with rounded corners -->
  <rect fill="#003399" width="512" height="512" rx="64"/>
  <!-- EU flag centered with padding -->
  <g transform="translate(64, 128)">
    <rect fill="#003399" width="384" height="256"/>
    <g fill="#fc0" transform="scale(21.33)translate(9,6)">
      <use xlink:href="#s" y="-6"/>
      <use xlink:href="#s" y="6"/>
      <g id="l">
        <use xlink:href="#s" x="-6"/>
        <use xlink:href="#s" transform="rotate(150)translate(0,6)rotate(66)"/>
        <use xlink:href="#s" transform="rotate(120)translate(0,6)rotate(24)"/>
        <use xlink:href="#s" transform="rotate(60)translate(0,6)rotate(12)"/>
        <use xlink:href="#s" transform="rotate(30)translate(0,6)rotate(42)"/>
      </g>
      <use xlink:href="#l" transform="scale(-1,1)"/>
    </g>
  </g>
</svg>